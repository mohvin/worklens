[project]
name = "worklens-worker"
version = "0.1.0"
description = "WorkLens pipeline: screen recording -> process map"
requires-python = ">=3.11"
dependencies = [
  "pillow>=10",
  "imagehash>=4.3",
  "numpy>=1.26",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "pydantic>=2.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
worklens = "worklens_worker.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["worklens_worker*"]
